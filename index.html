<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>RIFF LAB 3.0</title><style>*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:18px;background:#151515;color:#eee;font:16px system-ui;color-scheme:dark}h1{color:#f3a653;letter-spacing:3px;margin-bottom:0}small{color:#aaa}nav,.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,input,select,textarea{font:inherit;background:#292929;color:#eee;border:1px solid #555;border-radius:9px;padding:11px}button{cursor:pointer}button.on,button.primary{background:#f3a653;color:#171717;border-color:#f3a653}input,select,textarea{width:100%;margin:5px 0 12px}label{display:block;color:#bbb;margin-top:12px}section{background:#202020;padding:15px;border-radius:14px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:auto}.row input{width:auto} .item{border-bottom:1px solid #444;padding:9px 0}a{color:#f3a653}button:disabled{opacity:.4}</style><h1>RIFF LAB</h1><small>SUNO MUSIC STUDIO · 3.0</small><nav id="nav"></nav><section id="main"></section><section><b>LIVE · SUNO STYLE</b><pre id="out"></pre><div class="row"><button class="primary" onclick="copy(promptText())">Prompt kopieren</button><button onclick="copy('Optimize this English Suno style prompt, preserve all musical settings and translate additions: '+promptText())">KI-Auftrag kopieren</button></div><p><a href="https://suno.com/create" target="_blank" rel="noopener">Suno öffnen ↗</a></p><small id="status" role="status"></small></section><script>
const genres={'Metal':['Thrash Metal','Heavy Metal','Doom Metal','Death Metal','Black Metal','Power Metal','Groove Metal'],'Stoner Rock':['Stoner Metal','Desert Rock','Psychedelic Stoner','Sludge','Heavy Fuzz Rock','Space Rock','Acid Rock'],'Punk Rock':['Classic Punk','Melodic Punk','Post-Punk','Hardcore Punk','Punk n Roll','Cowpunk'],'Nu Metal':['Classic Nu Metal','Heavy Nu Metal','Experimental Electronic Nu Metal','Modern Nu Metal']};

const bands={'Metal':{'Metallica':'tight thrash riffs, galloping rhythms, melodic guitar harmonies','Slayer':'chromatic thrash riffs','Pantera':'syncopated groove riffs','Black Sabbath':'dark blues riffs','Megadeth':'technical thrash riffs'},'Stoner Rock':{'Stoned Jesus':'hypnotic fuzz riffs, psychedelic progression','Kyuss':'warm desert fuzz, loose blues grooves','Sleep':'slow monolithic riffs','Truckfighters':'energetic fuzz grooves','Electric Wizard':'saturated doom riffs','Colour Haze':'organic psychedelic textures'},'Punk Rock':{'Social Distortion':'melodic punk, bluesy rock and roll guitars, gritty vocals','Bad Religion':'fast melodic punk, vocal harmonies','The Clash':'raw punk energy','Rancid':'melodic basslines, raspy vocals','The Offspring':'driving power chords'},'Nu Metal':{'Korn':'dissonant low-tuned riffs, percussive bass','Deftones':'dreamy textures, heavy guitars','Slipknot':'percussive riffs, harsh vocals','Limp Bizkit':'bouncy syncopation, rap vocals','Linkin Park':'electronic textures, melodic hooks','Static-X':'industrial grooves','Mudvayne':'technical bass, complex syncopation','System of a Down':'abrupt rhythmic changes'}};
const sounds={Gitarre:['British tube amp tone','American high gain','vintage tube amp','thick saturated fuzz','overdrive','woolly fuzz','octave fuzz','double-tracked guitars','feedback','pinch harmonics'],Bass:['massive low-end bass','growling bass','distorted bass','fuzz bass','metallic bass','picked bass','slap bass','independent bassline','fingerstyle bass'],Drums:['organic acoustic drums','modern punchy drums','vintage drums','industrial drums','dry tight drums','half-time drums','hip-hop groove','double-kick','breakbeat','syncopated drums','deep kick','cracking snare','thunderous toms','ghost notes','experimental fills'],Effekte:['delay','reverb','phaser','flanger','chorus','wah-wah','tremolo','pitch shifter','industrial noise','glitch','turntable scratches','synth pads','drones','reverse effects'],Produktion:['warm analog production','modern polished production','raw gritty production','lo-fi','live-band feel','wall of sound','wide stereo guitars','powerful low-end','dynamic production']};
const blank=()=>({name:'Neue Songidee',genre:'Nu Metal',sub:'',key:'',bpm:'',tuning:'',mood:[],scale:[],instruments:[],vocals:[],structure:[],riffs:[],extra:Array(10).fill(''),mix:false,genre2:'Stoner Rock',sub2:'Psychedelic Stoner',ratio:70,focus:[],mixExtra:'',bands:[],bandFocus:[],bandStrength:'balanced',bandExtra:'',parts:[],sound:{},soundExtra:{},arrExtra:''});let db={current:blank(),favorites:[]};try{let x=JSON.parse(localStorage.getItem('rifflab3'));if(x?.current&&Array.isArray(x.favorites))db=x}catch{}let s=db.current,page=0,step=0,bg='Nu Metal',sg='Gitarre',pi=0,locks={};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=x=>JSON.parse(JSON.stringify(x));const val=x=>x.split('|')[0],lab=x=>x.split('|')[1]||x.split('|')[0];const keys=['genre','sub','mood','key','tuning','bpm','instruments','vocals','structure','riffs'],titles=['Hauptgenre','Untergenre','Stimmung','Tonart & Tonleiter','Gitarrenstimmung','Tempo','Instrumente','Gesang','Songstruktur','Riffs & Details'];const pages=['Songidee','Würfeln','Genre-Mix','Referenzbands','Arrangement','Sound Design','Favoriten'];
function get(k){return k.split('.').reduce((o,p)=>o?.[p],s)}function set(k,v){let p=k.split('.'),o=s;while(p.length>1){let a=p.shift();o[a]??={};o=o[a]}o[p[0]]=v;if(k==='genre')s.sub='';if(k==='genre2')s.sub2='';save()}function save(){db.current=s;try{localStorage.setItem('rifflab3',JSON.stringify(db))}catch{$('status').textContent='Lokaler Speicher nicht verfügbar – bitte exportieren.'} $('out').textContent=promptText()}
function promptText(){let a=[s.mix?`${s.sub||s.genre} (${s.ratio}%) fused with ${s.sub2||s.genre2} (${100-s.ratio}%)`:s.sub||s.genre,...s.mood,s.key,...s.scale,s.tuning&&s.tuning+' guitar tuning',s.bpm&&s.bpm+' BPM',...s.instruments,...s.vocals,...s.structure,...s.riffs,...s.extra];if(s.mix)a.push(s.focus.length?'secondary influences in '+s.focus.join(', '):'',s.mixExtra);for(let b of s.bands){let d=Object.values(bands).find(g=>g[b]);if(d)a.push(s.bandStrength+' influences: '+d[b])}a.push(s.bandFocus.length?'focus on '+s.bandFocus.join(', '):'',s.bandExtra,...Object.values(s.sound).flat(),...Object.values(s.soundExtra),s.parts.length?'Song structure: '+s.parts.map(p=>p.type).join(' - '):'',s.arrExtra);return a.filter(Boolean).join(', ')}
function chips(k,list,multi=true){let old=get(k);return '<div class="chips">'+list.map(x=>`<button data-k="${esc(k)}" data-v="${esc(val(x))}" data-m="${multi}" class="${(multi?(old||[]).includes(val(x)):old===val(x))?'on':''}">${esc(lab(x))}</button>`).join('')+'</div>'}function field(k,text,area=false){return `<label>${esc(text)}</label>${area?`<textarea data-field="${k}">${esc(get(k))}</textarea>`:`<input data-field="${k}" value="${esc(get(k))}">`}`}function select(k,list){return `<select data-field="${k}">${list.map(x=>`<option value="${esc(x)}" ${get(k)===x?'selected':''}>${esc(x||'Offen')}</option>`).join('')}</select>`}function btn(a,t){return `<button data-a="${a}">${t}</button>`}function lyrics(){return s.parts.map(p=>`[${p.type}]\n[${p.bars} bars, intensity ${p.intensity}/5${p.details?', '+p.details:''}]`).join('\n\n')}
function render(){ $('nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${page===i?'on':''}">${p}</button>`).join('');let h='';if(page===0){let k=keys[step];h=`<small>Schritt ${step+1}/10</small><h2>${titles[step]}</h2>`;if(k==='genre')h+=chips(k,Object.keys(genres),false);else if(k==='sub')h+=chips(k,genres[s.genre],false);else if(k==='key')h+=select(k,['',...['minor','major'].flatMap(m=>['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'].map(n=>n+' '+m))])+chips('scale',opts.scale);else if(k==='bpm')h+=field(k,'BPM')+chips(k,['60','75','90','115','130','160','180'],false);else h+=chips(k,opts[k],k!=='tuning');h+=field('extra.'+step,'Eigene Ergänzung',true)+`<div class="row">${btn('prev','← Zurück')}${btn('next','Weiter →')}${btn('skip','Offen lassen')}</div>`}if(page===1){h='<h2>Songideen würfeln</h2>'+select('genre',Object.keys(genres))+['sub','mood','key','tuning','bpm','riffs','vocals'].map(k=>`<div class="item row"><span>${esc(k)}: ${esc(get(k))}</span>${btn('lock:'+k,locks[k]?'🔒':'🔓')}</div>`).join('')+btn('roll','🎲 Würfeln')}if(page===2){h='<h2>Genre-Mix</h2>'+btn('mix',s.mix?'Mix aktiv ✓':'Mix aktivieren')+select('genre',Object.keys(genres))+select('sub',['',...genres[s.genre]])+select('genre2',Object.keys(genres))+select('sub2',['',...genres[s.genre2]])+`<p>${s.ratio}% / ${100-s.ratio}%</p><input type="range" min="50" max="95" step="5" data-field="ratio" value="${s.ratio}">`+chips('focus',['guitar tone and riffs','rhythmic groove','vocals','atmosphere','drums','production'])+field('mixExtra','Eigene Ideen',true)}if(page===3){h='<h2>Referenzbands</h2><div class="chips">'+Object.keys(bands).map(g=>btn('bg:'+g,g)).join('')+'</div>'+chips('bands',Object.keys(bands[bg]))+'<small>'+esc(s.bands.join(', '))+'</small>'+chips('bandFocus',['guitar riffs','bass','drums','vocals','atmosphere','arrangement','production'])+select('bandStrength',['subtle','balanced','strong'])+field('bandExtra','Weitere Bands / Ideen',true)}if(page===4){h='<h2>Arrangement</h2>'+s.parts.map((p,i)=>`<div class="item">${btn('part:'+i,`${i+1}. ${esc(p.type)} · ${p.bars} Takte`)}</div>`).join('')+btn('standard','Standardstruktur')+btn('add','+ Abschnitt');let p=s.parts[pi];if(p)h+=`<h3>Abschnitt ${pi+1}</h3>`+select('parts.'+pi+'.type',['Intro','Verse','Pre-Chorus','Chorus','Breakdown','Bridge','Guitar Solo','Instrumental','Outro'])+field('parts.'+pi+'.bars','Takte')+select('parts.'+pi+'.intensity',['1','2','3','4','5'])+field('parts.'+pi+'.details','Klang, Gesang & Ideen',true)+`<div class="row">${btn('up','↑')}${btn('down','↓')}${btn('duplicate','Duplizieren')}${btn('delete','Löschen')}</div>`;h+=field('arrExtra','Weitere Wünsche',true)+'<pre>'+esc(lyrics())+'</pre>'+btn('lyrics','Songstruktur kopieren')}if(page===5){h='<h2>Sound Design</h2><div class="chips">'+Object.keys(sounds).map(g=>btn('sg:'+g,g)).join('')+'</div><h3>'+sg+'</h3>'+chips('sound.'+sg,sounds[sg])+field('soundExtra.'+sg,'Eigene Klangideen',true)}if(page===6){h='<h2>Favoriten & Presets</h2>'+field('name','Name der Songidee')+btn('favorite','★ Speichern')+db.favorites.map((f,i)=>`<div class="item">${esc(f.name)} ${btn('load:'+i,'Laden')} ${btn('remove:'+i,'Löschen')}</div>`).join('')+'<h3>Werkspresets</h3>'+['Heavy Nu Metal × Stoner','Experimental Nu Metal','Psychedelic Desert Fuzz','Classic Thrash','Melodic Punk'].map((n,i)=>btn('preset:'+i,n)).join('')+'<h3>Datensicherung</h3>'+btn('export','JSON exportieren')+'<label>JSON importieren</label><input type="file" id="import" accept=".json">'+btn('reset','Neue Songidee')};$('main').innerHTML=h;save()}
const pick=a=>a[Math.floor(Math.random()*a.length)];const part=t=>({type:t,bars:'8',intensity:'3',details:''});function copy(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>$('status').textContent='Kopiert.').catch(()=>fallback(t));else fallback(t)}function fallback(t){let a=document.createElement('textarea');a.value=t;$('main').append(a);a.select();try{document.execCommand('copy')}catch{} $('status').textContent='Text markiert – bei Bedarf manuell kopieren.'}
document.addEventListener('input',e=>{if(e.target.dataset.field)set(e.target.dataset.field,e.target.value)});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{let x=JSON.parse(await e.target.files[0].text());if(!x.current||!genres[x.current.genre]||!Array.isArray(x.favorites))throw 0;db=x;s={...blank(),...x.current};pi=0;render()}catch{alert('Ungültige Sicherung')}}else if(e.target.dataset.field)render()});document.addEventListener('click',e=>{let d=e.target.closest('button')?.dataset;if(!d)return;if(d.page!==undefined)page=+d.page;if(d.k){let old=get(d.k)||[];set(d.k,d.m==='true'?(old.includes(d.v)?old.filter(x=>x!==d.v):[...old,d.v]):d.v)}let [a,v]=(d.a||'').split(':');switch(a){case'prev':step=Math.max(0,step-1);break;case'skip':if(step>0)set(keys[step],Array.isArray(get(keys[step]))?[]:'');s.extra[step]='';if(step===3)s.scale=[];case'next':if(step<9)step++;else page=6;break;case'lock':locks[v]=!locks[v];break;case'roll':for(let [k,list] of Object.entries({sub:genres[s.genre],mood:opts.mood,key:['D minor','E minor','C minor','A minor'],tuning:opts.tuning,bpm:s.genre==='Punk Rock'?['140','160','180']:['75','90','115','130'],riffs:opts.riffs,vocals:opts.vocals})){if(!locks[k])set(k,Array.isArray(get(k))?[val(pick(list))]:val(pick(list)))}break;case'mix':s.mix=!s.mix;break;case'bg':bg=v;break;case'sg':sg=v;break;case'part':pi=+v;break;case'standard':s.parts=['Intro','Verse','Chorus','Verse','Chorus','Breakdown','Chorus','Outro'].map(part);pi=0;break;case'add':s.parts.push(part('Verse'));pi=s.parts.length-1;break;case'up':case'down':let j=pi+(a==='up'?-1:1);if(j>=0&&j<s.parts.length){[s.parts[j],s.parts[pi]]=[s.parts[pi],s.parts[j]];pi=j}break;case'duplicate':s.parts.splice(pi+1,0,clone(s.parts[pi]));pi++;break;case'delete':s.parts.splice(pi,1);pi=Math.max(0,pi-1);break;case'lyrics':copy(lyrics());return;case'favorite':db.favorites.push(clone(s));break;case'load':s=clone(db.favorites[+v]);page=0;step=0;pi=0;break;case'remove':db.favorites.splice(+v,1);break;case'reset':if(confirm('Aktuelle Songidee zurücksetzen?')){s=blank();step=0;page=0;pi=0;locks={}}break;case'preset':let p=[['Nu Metal','Heavy Nu Metal','115','D minor','Drop D'],['Nu Metal','Experimental Electronic Nu Metal','90','C minor','D-Standard'],['Stoner Rock','Psychedelic Stoner','85','D minor','Drop D'],['Metal','Thrash Metal','160','E minor','E-Standard'],['Punk Rock','Melodic Punk','145','A major','E-Standard']][+v];s=blank();[s.genre,s.sub,s.bpm,s.key,s.tuning]=p;if(+v===0){s.mix=true;s.mood=['aggressive'];s.riffs=['dissonant riffs'];s.vocals=['rhythmic rap vocals']}page=0;step=0;pi=0;break;case'export':let u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let l=document.createElement('a');l.href=u;l.download='riff-lab-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}render()});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
